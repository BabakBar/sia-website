# =============================================================================
# babakbarghi.com
#
# This file is the real serving config. Until 2026-08-23 the app was built with
# nixpacks, which generated its own nginx config inside the image and ignored
# the copy in this repo; the build is now a Dockerfile so what is here is what
# runs, and the Dockerfile copies this file. See Dockerfile.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Behind a TLS reverse proxy — never leak the internal port in redirects.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /revision.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Resolved per request rather than pinned at startup, so a change to the
    # analytics host's Cloudflare IPs does not require a redeploy.
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $umami_upstream "umami.fabriktakt.com";

    # Keep the tracker and collection requests same-origin. Forward only the
    # headers the collector uses, and authenticate the TLS connection upstream.
    proxy_pass_request_headers off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;

    location = /s/t.js {
        limit_except GET { deny all; }
        proxy_pass https://$umami_upstream/script.js;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        access_log off;
    }

    location = /s/api/send {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass https://$umami_upstream/api/send;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header X-Umami-Website-Id $http_x_umami_website_id;
        proxy_set_header X-Umami-Hostname $http_x_umami_hostname;
        proxy_set_header X-Umami-Cache $http_x_umami_cache;
        access_log off;

        # Umami hashes the client IP into the visitor id and resolves country
        # from it. This request reaches the upstream through Cloudflare a
        # second time, which overwrites CF-Connecting-IP with this container's
        # egress IP, so the real address is forwarded in a header Cloudflare
        # leaves alone. Umami reads it via CLIENT_IP_HEADER.
        proxy_set_header X-BH-Client-IP $http_cf_connecting_ip;
    }

    # Unknown URLs get a real 404 so crawlers can distinguish them from pages.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
