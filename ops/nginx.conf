# =============================================================================
# babakbarghi.com
#
# This file is the real serving config. Until 2026-08-23 the app was built with
# nixpacks, which generated its own nginx config inside the image and ignored
# the copy in this repo; the build is now a Dockerfile so what is here is what
# runs, and the Dockerfile copies this file. See Dockerfile.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Behind a TLS reverse proxy — never leak the internal port in redirects.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Resolved per request rather than pinned at startup, so a change to the
    # analytics host's Cloudflare IPs does not require a redeploy.
    resolver 127.0.0.11 valid=60s ipv6=off;
    set $umami_upstream "umami.fabriktakt.com";

    # First-party analytics proxy.
    #
    # EasyPrivacy ships the rule "||umami.*/script.js|$script", which matches
    # the upstream's own URL, so every uBlock/AdGuard/Brave visitor silently
    # drops out of analytics. Serving the tracker from this origin under a
    # neutral path avoids that. The tracker derives its collect endpoint from
    # its own src directory, so /s/t.js posts to /s/api/send with no
    # client-side config.
    #
    # Both are exact matches, so they take priority over the SPA fallback.
    location = /s/t.js {
        proxy_pass https://$umami_upstream/script.js;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # The upstream sits behind Cloudflare too. Cloudflare rejects requests
        # that arrive carrying its own hop headers (a client-supplied
        # CF-Connecting-IP returns 403), and every request reaching this
        # container already has them, so drop them before the second hop.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
    }

    location = /s/api/send {
        proxy_pass https://$umami_upstream/api/send;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";

        # Umami hashes the client IP into the visitor id and resolves country
        # from it. This request reaches the upstream through Cloudflare a
        # second time, which overwrites CF-Connecting-IP with this container's
        # egress IP, so the real address is forwarded in a header Cloudflare
        # leaves alone. Umami reads it via CLIENT_IP_HEADER.
        proxy_set_header X-BH-Client-IP $http_cf_connecting_ip;
    }

    # Every published route is emitted as a real file by the prerender pass
    # (/, /blog/, and one directory per published post), so an unknown path
    # must 404 rather than fall back to the homepage. A 200 + homepage for
    # every dead URL makes Google file those URLs as duplicates of the
    # homepage. scripts/verify-static-output.mjs asserts this exact line.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
