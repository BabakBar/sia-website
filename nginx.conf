server {
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    # First-party analytics proxy (bypasses ad-blockers)
    location = /s/t.js {
        proxy_pass https://umami.fabriktakt.com/script.js;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # Strip Cloudflare hop headers before the second hop
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
    }

    location = /s/api/send {
        proxy_pass https://umami.fabriktakt.com/api/send;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # Strip Cloudflare hop headers before the second hop
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
    }

    # Handle 404 errors
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Handle server errors (50x)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
