server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=60s ipv6=off;
    set $umami_upstream "umami.fabriktakt.com";

    # First-party analytics proxy (bypasses EasyPrivacy / ad-blockers)
    location = /s/t.js {
        proxy_pass https://$umami_upstream/script.js;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # Strip Cloudflare hop headers before the second hop
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
    }

    location = /s/api/send {
        proxy_pass https://$umami_upstream/api/send;
        proxy_set_header Host umami.fabriktakt.com;
        proxy_ssl_server_name on;
        proxy_ssl_name umami.fabriktakt.com;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        access_log off;

        # Strip Cloudflare hop headers before the second hop
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-RAY "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CF-Worker "";
        proxy_set_header CDN-Loop "";
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
