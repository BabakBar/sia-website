name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun audit --audit-level high

      - name: Build under production environment
        run: bun run build
        env:
          NODE_ENV: production

      - run: bun run test

      - name: Check the real production image locally
        run: |
          docker build --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t sia-website:ci .
          docker network create sia-website-check-net
          docker run -d --name sia-website-check --network sia-website-check-net -p 127.0.0.1:8080:80 sia-website:ci
          trap 'docker rm -f sia-website-check; docker network rm sia-website-check-net' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 --silent --show-error http://127.0.0.1:8080/ -o /dev/null
          SMOKE_BASE_URL=http://127.0.0.1:8080 SMOKE_EXPECTED_REVISION="$GITHUB_SHA" bun run test:http

      - name: Deploy and wait for the public revision
        run: bun scripts/deploy.ts
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}

      - name: Verify the public website
        run: bun run test:http
        env:
          SMOKE_BASE_URL: https://www.babakbarghi.com
          SMOKE_EXPECTED_REVISION: ${{ github.sha }}
